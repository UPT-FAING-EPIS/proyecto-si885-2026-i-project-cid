name: Unidad II — pruebas y documentación

on:
  push:
    paths:
      - "unidad2/**"
      - ".github/workflows/unidad2.yml"
  pull_request:
    paths:
      - "unidad2/**"
      - ".github/workflows/unidad2.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r unidad2/requirements.txt
      - run: python -m pytest unidad2/tests -q
      - run: python unidad2/docs/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-dimensional-unidad2
          path: unidad2/docs/modelo_generado.md
